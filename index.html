<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky31 Coffee</title>
<meta name="description" content="Sky31 Coffee To Go 線上點餐">
<meta property="og:title" content="Sky31 Coffee">
<meta property="og:description" content="精品咖啡・由心製作">
<meta property="og:image" content="https://sky31-order.pages.dev/sky31-logo.png">
<style>
:root{
  --bg:#fbfaf7; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
  --card:#fff; --dark:#111827; --accent:#1f2937; --ok:#16a34a; --warn:#d6a500; --blue:#2563eb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",Arial,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 110px}
.hero{padding:22px 0 14px;text-align:center}
.logo{width:min(320px,72vw);max-height:150px;object-fit:contain}
.hero h1{margin:8px 0 6px;font-size:24px;letter-spacing:.5px}
.hero p{margin:0;color:var(--muted);line-height:1.55;font-size:14px}
.hours{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 6px;color:#374151;font-weight:700;font-size:13px}
.actions{display:flex;gap:10px;margin:16px 0}
.btn{border:0;border-radius:16px;padding:14px 16px;font-weight:900;background:#f3f4f6;color:#111827}
.btn.primary{background:#111827;color:#fff;box-shadow:0 10px 22px rgba(0,0,0,.14)}
.btn.full{width:100%}
.btn:disabled{opacity:.6;cursor:not-allowed}
.section-title{font-size:28px;margin:20px 0 14px;font-weight:950}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.product{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.045)}
.product:active{transform:scale(.99)}
.p-img{height:128px;background:#f3f4f6 center/cover no-repeat}
.p-body{padding:13px}
.p-body h3{margin:0 0 5px;font-size:20px}
.p-body p{margin:0;color:var(--muted);font-weight:700}
.float-cart{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:20;width:68px;height:68px;border-radius:50%;border:1px solid #d1d5db;background:#eef2f7;box-shadow:0 12px 32px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:26px}
.badge{position:absolute;right:-4px;top:-4px;background:#fff;border:2px solid #dbeafe;color:#2563eb;border-radius:999px;min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:900}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:40;display:none}
.overlay.show{display:block}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100vw);max-height:92vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;z-index:50;padding:18px 18px calc(22px + env(safe-area-inset-bottom));display:none}
.sheet.show{display:block}
.close{position:absolute;right:18px;top:16px;width:46px;height:46px;border-radius:50%;border:0;background:#f3f4f6;color:#2563eb;font-size:28px;font-weight:800}
.sheet h2{font-size:28px;margin:42px 0 4px}
.sub{color:#6b7280;letter-spacing:3px;font-weight:800;font-size:13px;text-transform:uppercase;margin-bottom:18px}
.detail-img{height:220px;border-radius:22px;background:#f3f4f6 center/cover no-repeat;margin:-4px -4px 18px}
label{display:block;margin:14px 0 7px;font-weight:900}
.input{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;font-size:16px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{border:1px solid var(--line);border-radius:14px;background:#fff;padding:11px 8px;font-weight:800;text-align:center}
.chip.active{background:#111827;color:#fff;border-color:#111827}
.bean-card{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff;margin:8px 0}
.bean-card.active{border-color:#111827;box-shadow:0 0 0 2px rgba(17,24,39,.08)}
.bean-title{font-weight:950}
.bean-note{font-size:13px;color:var(--muted);line-height:1.45;margin-top:5px}
.qty-row{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0}
.qty-btn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:#f9fafb;font-size:26px;font-weight:900}
.qty-num{min-width:50px;text-align:center;font-size:24px;font-weight:950}
.cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cart-thumb{width:58px;height:58px;border-radius:14px;background:#f3f4f6 center/cover no-repeat;flex:0 0 auto}
.cart-main{flex:1}
.cart-main b{font-size:17px}
.cart-main small{display:block;color:var(--muted);line-height:1.4;margin-top:4px}
.cart-controls{display:flex;align-items:center;gap:8px}
.mini{border:0;border-radius:12px;background:#f3f4f6;font-weight:900;padding:8px 10px}
.summary{border:1px solid var(--line);border-radius:20px;padding:14px;margin:14px 0;background:#fff}
.summary-head{display:flex;justify-content:space-between;font-weight:950;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
.customer-line{display:flex;gap:8px;align-items:center;color:#6b7280;font-weight:800;margin:8px 0 14px}
.status-card{border:1px solid var(--line);border-radius:20px;background:#fff;padding:14px;margin:12px 0}
.status-head{display:flex;justify-content:space-between;align-items:center;font-weight:950;font-size:18px}
.status-toggle{margin-top:10px;width:100%;border:1px solid var(--line);border-radius:14px;background:#f9fafb;padding:10px;font-weight:900}
.status-body{display:none;margin-top:12px}
.status-body.open{display:block}
.status-item{background:#f9fafb;border:1px solid #eef2f7;border-radius:16px;padding:12px;margin:8px 0}
.status-item b{font-size:16px}
.status-item small{display:block;color:var(--muted);line-height:1.45;margin-top:5px}
.status-scroll{max-height:56vh;overflow:auto;padding-right:3px}
.err{color:#dc2626;font-weight:800}
.hidden{display:none!important}
@media(max-width:430px){
  .wrap{padding:14px 12px 105px}
  .grid{gap:10px}
  .p-img{height:118px}
  .p-body h3{font-size:18px}
  .sheet{padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
  .sheet h2{font-size:27px}
  .detail-img{height:190px}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <img class="logo" src="./sky31-logo.png" alt="Sky31 Coffee" onerror="this.style.display='none'">
    <h1>Sky31 Coffee To Go</h1>
    <p>精品咖啡・由心製作<br>每一杯咖啡均以新鮮研磨與穩定萃取製作。</p>
    <div class="hours"><span>08:30 - 09:00</span><span>13:00 - 13:30</span><span>20:00 - 21:00</span></div>
    <div class="actions">
      <button class="btn primary full" type="button" onclick="document.getElementById('menuTitle').scrollIntoView({behavior:'smooth'})">☕ 開始點餐 Start Ordering</button>
      <button class="btn full" type="button" onclick="openStatus()">查詢訂單</button>
    </div>
  </section>
  <h2 id="menuTitle" class="section-title">請選擇飲品</h2>
  <div id="menu" class="grid"></div>
</div>

<button id="cartBtn" class="float-cart" type="button" onclick="openCart()">🛒<span id="cartBadge" class="badge">0</span></button>
<div id="overlay" class="overlay" onclick="closeAll()"></div>

<section id="detailSheet" class="sheet">
  <button class="close" type="button" onclick="closeAll()">×</button>
  <div id="detailImg" class="detail-img"></div>
  <h2 id="detailName"></h2>
  <div id="detailCn" class="sub"></div>
  <p id="detailDesc" style="color:#6b7280;line-height:1.55"></p>

  <label>咖啡豆 Bean</label>
  <div id="beanChoices"></div>

  <label id="tempLabel">冷熱 Temperature</label>
  <div id="tempChoices" class="chips">
    <button class="chip active" type="button" data-value="Hot 熱">Hot 熱</button>
    <button class="chip" type="button" data-value="Iced 凍">Iced 凍</button>
  </div>

  <div id="iceArea">
    <label>冰量 Ice</label>
    <div id="iceChoices" class="chips">
      <button class="chip active" type="button" data-value="正常冰">正常冰</button>
      <button class="chip" type="button" data-value="少冰">少冰</button>
    </div>
  </div>

  <div id="milkArea">
    <label>奶類 Milk</label>
    <div id="milkChoices" class="chips">
      <button class="chip active" type="button" data-value="No Milk 不加奶">No Milk 不加奶</button>
      <button class="chip" type="button" data-value="Whole Milk 全脂奶">Whole Milk 全脂奶</button>
    </div>
  </div>

  <label>取餐 Pickup</label>
  <div id="pickupChoices" class="chips">
    <button class="chip active" type="button" data-value="Now 即取">Now 即取</button>
    <button class="chip" type="button" data-value="30分鐘後">30分鐘後</button>
    <button class="chip" type="button" data-value="明天早上">明天早上</button>
    <button class="chip" type="button" data-value="明天中午">明天中午</button>
  </div>

  <label>備註 Note</label>
  <input id="noteInput" class="input" placeholder="例如少甜、不要朱古力粉等">

  <div class="qty-row">
    <button class="qty-btn" type="button" onclick="changeDetailQty(-1)">−</button>
    <div id="detailQty" class="qty-num">1</div>
    <button class="qty-btn" type="button" onclick="changeDetailQty(1)">＋</button>
  </div>
  <button class="btn primary full" type="button" onclick="addToCart()">加入購物車 Add to Cart</button>
</section>

<section id="cartSheet" class="sheet">
  <button class="close" type="button" onclick="closeAll()">×</button>
  <h2>確認訂單</h2>
  <div class="sub">Checkout</div>
  <div class="customer-line">👤 <span id="customerNameText">未填姓名</span> ｜ 📞 <span id="customerPhoneText">未填電話</span></div>
  <div id="cartList"></div>
  <div class="summary">
    <div class="summary-head"><span>總杯數</span><span id="totalCups">0 杯</span></div>
    <div id="summaryList"></div>
  </div>
  <p style="color:#6b7280;font-weight:800">確認後訂單會直接發送到 Sky31 Coffee。</p>
  <button id="checkoutSubmitBtn" class="btn primary full" type="button" onclick="submitOrder()">確認訂單 Checkout</button>
  <button class="btn full" type="button" onclick="clearCart()">清空訂單 Clear Order</button>
</section>

<section id="customerSheet" class="sheet">
  <button class="close" type="button" onclick="closeAll()">×</button>
  <h2>客人資料</h2>
  <div class="sub">Customer</div>
  <label>姓名 Name</label>
  <input id="name" class="input" autocomplete="name" placeholder="請輸入姓名">
  <label>手機 Phone</label>
  <input id="phone" class="input" inputmode="tel" autocomplete="tel" placeholder="請輸入手機號碼">
  <button class="btn primary full" type="button" style="margin-top:16px" onclick="saveCustomer()">保存 Save</button>
</section>

<section id="statusSheet" class="sheet">
  <button class="close" type="button" onclick="closeAll()">×</button>
  <h2>查詢訂單</h2>
  <div class="sub">Order Status</div>
  <label>訂單號 Order No. <span style="color:#9ca3af;font-weight:700">可不填</span></label>
  <input id="statusOrderNo" class="input" placeholder="可不填；如有訂單號可輸入">
  <label>手機 Phone</label>
  <input id="statusPhone" class="input" inputmode="tel" placeholder="請輸入下單手機">
  <button class="btn primary full" type="button" style="margin-top:14px" onclick="checkStatus()">查詢 Check Status</button>
  <div id="statusResult" style="margin-top:14px"></div>
</section>

<script>
"use strict";

const PRODUCTS = [
  {name:"Americano",cn:"美式咖啡",desc:"經典意式濃縮咖啡加水調製，口感清爽。",milk:false,img:"./americano-new.jpg",type:"americano"},
  {name:"Latte",cn:"拿鐵",desc:"濃縮咖啡配牛奶，口感順滑。",milk:true,img:"./latte-new.jpg",type:"milk"},
  {name:"Cappuccino",cn:"卡布奇諾",desc:"咖啡、牛奶與細緻奶泡的經典比例。",milk:true,img:"./cappuccino-new.jpg",type:"milk"},
  {name:"Mocha",cn:"摩卡咖啡",desc:"咖啡與朱古力風味融合，甜感更突出。",milk:true,img:"./dirty-coffee.jpg",type:"milk"},
  {name:"Classic Chocolate",cn:"經典冷/熱可可",desc:"經典可可飲品，可選熱飲或凍飲。",milk:true,img:"./cappuccino-new.jpg",type:"milk"},
  {name:"Dirty",cn:"髒髒咖啡",desc:"冰牛奶配濃縮咖啡，層次分明。",milk:true,img:"./dirty.jpg",type:"milk",forceIced:true}
];

const BEANS = {
  americano:[
    {label:"淺烘精品豆",flavor:"櫻桃、草莓、紅石榴、紅酒",note:"果香明亮，酸甜平衡，層次豐富"},
    {label:"中深烘拼配豆",flavor:"黑巧克力、烤榛子、烏梅",note:"醇厚順滑，回甘持久，經典咖啡風格"}
  ],
  milk:[
    {label:"中深烘拼配豆",flavor:"松子仁、話梅糖、餅乾",note:"適合奶咖，甜感較厚"},
    {label:"淺烘精品豆",flavor:"草莓牛奶、糖漬櫻桃、奶綠",note:"奶香與果香融合，口感細膩"}
  ]
};

let cart = [];
let currentIndex = -1;
let qty = 1;
let selectedBean = null;
let submitting = false;

function $(id){return document.getElementById(id)}
function esc(v){return String(v ?? "").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function val(id){return ($(id)?.value || "").trim()}
function show(id){$("overlay").classList.add("show");$(id).classList.add("show");document.body.style.overflow="hidden"}
function closeAll(){document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("show"));$("overlay").classList.remove("show");document.body.style.overflow=""}

function loadState(){
  try{cart=JSON.parse(localStorage.getItem("sky31_cart")||"[]")}catch(e){cart=[]}
  $("name").value=localStorage.getItem("sky31_name")||"";
  $("phone").value=localStorage.getItem("sky31_phone")||"";
}
function saveState(){
  try{localStorage.setItem("sky31_cart",JSON.stringify(cart))}catch(e){}
}
function saveCustomer(){
  localStorage.setItem("sky31_name",val("name"));
  localStorage.setItem("sky31_phone",val("phone"));
  updateCustomer();
  closeAll();
}
function updateCustomer(){
  $("customerNameText").textContent=val("name")||"未填姓名";
  $("customerPhoneText").textContent=val("phone")||"未填電話";
}

function renderMenu(){
  const menu=$("menu"); menu.innerHTML="";
  PRODUCTS.forEach((p,i)=>{
    const div=document.createElement("button");
    div.type="button"; div.className="product"; div.onclick=()=>openDetail(i);
    div.innerHTML='<div class="p-img" style="background-image:url('+esc(p.img)+')"></div><div class="p-body"><h3>'+esc(p.name)+'</h3><p>'+esc(p.cn)+'</p></div>';
    menu.appendChild(div);
  });
}

function bindChips(container){
  container.querySelectorAll(".chips").forEach(group=>{
    group.querySelectorAll(".chip").forEach(chip=>{
      chip.onclick=()=>{
        group.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
        chip.classList.add("active");
        updateOptionVisibility();
      };
    });
  });
}
function chipValue(id){
  const el=$(id)?.querySelector(".chip.active");
  return el ? el.dataset.value : "";
}
function renderBeans(p){
  const beans=BEANS[p.type||"milk"]||BEANS.milk;
  selectedBean=beans[0];
  $("beanChoices").innerHTML=beans.map((b,i)=>
    '<button type="button" class="bean-card '+(i===0?'active':'')+'" data-idx="'+i+'"><div class="bean-title">'+esc(b.label)+'</div><div class="bean-note">風味：'+esc(b.flavor)+'<br>'+esc(b.note)+'</div></button>'
  ).join("");
  $("beanChoices").querySelectorAll(".bean-card").forEach(btn=>{
    btn.onclick=()=>{
      $("beanChoices").querySelectorAll(".bean-card").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      selectedBean=beans[Number(btn.dataset.idx)]||beans[0];
    };
  });
}
function updateOptionVisibility(){
  const p=PRODUCTS[currentIndex];
  const temp=p?.forceIced ? "Iced 凍" : chipValue("tempChoices");
  $("iceArea").classList.toggle("hidden", !(temp.includes("Iced") || temp.includes("凍")));
  $("milkArea").classList.toggle("hidden", !p?.milk);
}

function openDetail(i){
  currentIndex=i; qty=1;
  const p=PRODUCTS[i];
  $("detailImg").style.backgroundImage="url("+p.img+")";
  $("detailName").textContent=p.name;
  $("detailCn").textContent=p.cn;
  $("detailDesc").textContent=p.desc;
  $("detailQty").textContent=qty;
  $("noteInput").value="";
  renderBeans(p);
  document.querySelectorAll("#detailSheet .chip").forEach(ch=>ch.classList.remove("active"));
  $("tempChoices").querySelector(".chip").classList.add("active");
  $("iceChoices").querySelector(".chip").classList.add("active");
  $("milkChoices").querySelector(".chip").classList.add("active");
  $("pickupChoices").querySelector(".chip").classList.add("active");
  if(p.forceIced){
    $("tempChoices").querySelectorAll(".chip").forEach(ch=>{ch.classList.toggle("active",ch.dataset.value.includes("Iced"));});
  }
  updateOptionVisibility();
  show("detailSheet");
}
function changeDetailQty(n){qty=Math.max(1,qty+n);$("detailQty").textContent=qty}
function addToCart(){
  const p=PRODUCTS[currentIndex]; if(!p)return;
  const temp=p.forceIced ? "Iced 凍" : chipValue("tempChoices");
  const item={
    name:p.name, cn:p.cn, image:p.img, qty:qty,
    bean:selectedBean?.label||"", flavor:selectedBean?.flavor||"",
    temp:temp, ice:(temp.includes("Iced")||temp.includes("凍"))?chipValue("iceChoices"):"不適用",
    milk:p.milk?chipValue("milkChoices"):"No Milk 不加奶",
    pickup:chipValue("pickupChoices")||"Now 即取",
    note:val("noteInput")||"無備註"
  };
  cart.push(item); saveState(); updateAll(); closeAll();
}
function itemDetails(it){
  return [it.bean,it.temp,it.ice!=="不適用"?it.ice:"",it.milk,it.pickup,it.note&&it.note!=="無備註"?"備註："+it.note:""].filter(Boolean).join("｜");
}
function updateCart(){
  $("cartBadge").textContent=cart.reduce((s,i)=>s+(Number(i.qty)||1),0);
  $("totalCups").textContent=$("cartBadge").textContent+" 杯";
  $("cartList").innerHTML=cart.length?cart.map((it,i)=>
    '<div class="cart-item"><div class="cart-thumb" style="background-image:url('+esc(it.image)+')"></div><div class="cart-main"><b>'+esc(it.name)+'</b><small>'+esc(itemDetails(it))+'</small></div><div class="cart-controls"><button class="mini" type="button" onclick="changeCartQty('+i+',-1)">−</button><b>'+it.qty+'</b><button class="mini" type="button" onclick="changeCartQty('+i+',1)">＋</button></div></div>'
  ).join(""):'<p style="color:#6b7280">尚未選擇飲品</p>';
  $("summaryList").innerHTML=cart.map(it=>'<div style="margin:8px 0"><b>'+esc(it.name)+' × '+it.qty+'</b><br><small style="color:#6b7280">'+esc(itemDetails(it))+'</small></div>').join("");
}
function changeCartQty(i,n){cart[i].qty=Math.max(1,(Number(cart[i].qty)||1)+n);saveState();updateAll()}
function clearCart(){cart=[];saveState();updateAll();closeAll()}
function openCart(){updateCustomer();show("cartSheet")}

function pad2(n){return String(n).padStart(2,"0")}
function dateOnly(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function pickupTime(label){
  const d=new Date(); let slot="";
  if(label.includes("明天早上")){d.setDate(d.getDate()+1);slot="08:30-09:00"}
  else if(label.includes("明天中午")){d.setDate(d.getDate()+1);slot="13:00-13:30"}
  else if(label.includes("30")){d.setMinutes(d.getMinutes()+30);slot=pad2(d.getHours())+":"+pad2(d.getMinutes())}
  else{slot="ASAP";label="即取"}
  return dateOnly(d)+" "+slot+"（"+label+"）";
}
function makeRobotOrder(){
  const no="{ORDER_NO}";
  const lines=["☕ SKY31 ORDER","","訂單號："+no,"取餐時間："+pickupTime(cart[0]?.pickup||"Now 即取"),""];
  cart.forEach(it=>{
    lines.push("☕ "+it.name+" ×"+it.qty);
    lines.push(itemDetails(it));
    lines.push("");
  });
  lines.push("客人："+val("name"));
  lines.push("電話："+val("phone"));
  return lines.join("\n").trim();
}
async function submitOrder(){
  if(submitting)return;
  if(!cart.length){alert("請先選擇餐品");return}
  if(!val("name")||!val("phone")){show("customerSheet");return}
  submitting=true;
  const btn=$("checkoutSubmitBtn"); const old=btn.innerHTML;
  btn.disabled=true; btn.innerHTML="提交中...";
  try{
    const payload={customerName:val("name"),phone:val("phone"),orderText:makeRobotOrder(),cart:cart,pickup:cart[0]?.pickup||"",createdAt:new Date().toISOString()};
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),12000));
    const req=fetch("/api/order?t="+Date.now(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),cache:"no-store"});
    const res=await Promise.race([req,timeout]);
    const data=await res.json();
    if(!res.ok||!data.ok){alert(data.error||"提交失敗，請稍後再試");return}
    alert("訂單已提交！\n訂單號：#"+data.orderNo);
    cart=[]; saveState(); updateAll(); closeAll();
    window.location.href=location.pathname+"?ok="+Date.now();
  }catch(e){
    alert("提交時間較長。\n請到查詢訂單輸入手機號碼確認是否已成功。");
    closeAll();
  }finally{
    submitting=false; btn.disabled=false; btn.innerHTML=old;
  }
}
function updateAll(){updateCustomer();updateCart()}

function openStatus(){ $("statusPhone").value=val("phone")||""; show("statusSheet") }
function statusLabel(o){
  if(o.displayStatus==="picked_up"||o.status==="picked_up")return "🔵 已領取";
  if(o.status==="completed")return "🟢 已完成";
  return "🟡 製作中";
}
function renderStatusItems(cart,orderText){
  if(Array.isArray(cart)&&cart.length){
    return cart.map(it=>'<div class="status-item"><b>☕ '+esc(it.name||it.cn||"-")+' × '+esc(it.qty||1)+'</b><small>'+esc([it.bean,it.flavor?"風味："+it.flavor:"",it.temp,it.ice!=="不適用"?it.ice:"",it.milk,it.note&&it.note!=="無備註"?"備註："+it.note:""].filter(Boolean).join("｜"))+'</small></div>').join("");
  }
  return orderText?'<pre class="status-item" style="white-space:pre-wrap">'+esc(orderText)+'</pre>':'<small>此訂單沒有保存飲品明細資料</small>';
}
function toggleStatus(id){
  const el=$(id); if(!el)return;
  el.classList.toggle("open");
}
async function checkStatus(){
  const phone=val("statusPhone"); const orderNo=val("statusOrderNo").replace(/^#/,"");
  const box=$("statusResult");
  if(!phone){box.innerHTML='<p class="err">請輸入手機號碼</p>';return}
  box.innerHTML="<p>查詢中...</p>";
  try{
    let url="/api/status?phone="+encodeURIComponent(phone)+"&t="+Date.now();
    if(orderNo)url+="&orderNo="+encodeURIComponent(orderNo);
    const res=await fetch(url,{cache:"no-store"});
    const data=await res.json();
    if(!data.ok){box.innerHTML='<p class="err">'+esc(data.error||"查詢不到訂單")+'</p>';return}
    const orders=data.orders||[data];
    box.innerHTML='<div class="status-scroll">'+orders.map((o,i)=>{
      const id="stbody"+i;
      return '<div class="status-card"><div class="status-head"><span>#'+esc(o.orderNo)+'</span><span>'+statusLabel(o)+'</span></div><small>取餐時間：'+esc(o.pickupTime||"-")+'</small><br>'+(o.completedAt?'<small>完成時間：'+esc(String(o.completedAt).replace("T"," ").slice(0,16))+'</small>':'')+'<button class="status-toggle" type="button" onclick="toggleStatus(\''+id+'\')">查看 / 收起</button><div id="'+id+'" class="status-body open">'+renderStatusItems(o.cart,o.orderText)+'</div></div>';
    }).join("")+'</div>';
  }catch(e){box.innerHTML='<p class="err">暫時無法查詢，請稍後再試。</p>'}
}

document.addEventListener("DOMContentLoaded",()=>{
  loadState(); renderMenu(); bindChips(document); updateAll();
});
window.addEventListener("error",e=>console.error("Sky31 error:",e.message,e.filename,e.lineno));
</script>
